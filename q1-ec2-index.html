<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Training</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0;

    .box { text-align:center; background:#1e293b; padding:2.5rem 3rem; border-radius:14px; }
    h1 { margin:0 0 1rem; }
    .ok { color:#22c55e; font-weight:600; font-size:1.2rem; }
    p { margin:.4rem 0; }
  </style>

<body>
  <div class="box">
    <h1>DevOps Training</h1>
    <p class="ok">Application deployed successfully!</p>
    <p>Server: AWS EC2</p>
    <p>Web Server: NGINX</p>
  </div>

</html>
